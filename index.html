<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkAI Production Cockpit</title>
<style>
  :root { color-scheme: light dark; --paper:#faf9f6; --surface:#fff; --surface-sunken:#f1efe9; --ink:#1d1f24; --ink-muted:#6b6a63; --ink-faint:#9a988e; --border:#e6e3da; --accent:#0e7c86; --accent-ink:#fff; --good:#2f8f5b; --good-soft:#e7f4ec; --amber:#b5750a; --amber-soft:#fbf0dd; --critical:#c4453f; --critical-soft:#fbeae9; }
  @media (prefers-color-scheme: dark) { :root { --paper:#14161a; --surface:#1b1e23; --surface-sunken:#21242a; --ink:#e9e7e0; --ink-muted:#a3a099; --ink-faint:#726f66; --border:#2e3138; --accent:#35b3ba; --accent-ink:#08191a; --good:#4fbf85; --good-soft:#17301f; --amber:#e0a53f; --amber-soft:#2f2717; --critical:#e2726c; --critical-soft:#351f1e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,"Zen Kaku Gothic New","Noto Sans JP",sans-serif; }
  .page { max-width:560px; margin:0 auto; padding:20px 16px 48px; display:flex; flex-direction:column; gap:16px; }
  .hdr { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .daybadge { display:inline-flex; background:var(--surface-sunken); color:var(--accent); border-radius:999px; padding:3px 12px; font-weight:700; font-size:13px; }
  h1 { font-size:18px; margin:6px 0 0; }
  .updated { font-size:10.5px; color:var(--ink-faint); text-align:right; line-height:1.5; }
  .health { padding:9px 14px; border-radius:12px; font-size:12.5px; font-weight:700; background:var(--good-soft); color:var(--good); }
  .health.attention { background:var(--amber-soft); color:var(--amber); }
  .health.red { background:var(--critical-soft); color:var(--critical); }
  .health-reason { font-size:11px; font-weight:500; margin-top:4px; opacity:.9; }
  .stale-banner { background:var(--critical-soft); color:var(--critical); border:2px solid var(--critical); border-radius:12px; padding:12px 14px; font-size:13px; font-weight:800; line-height:1.6; }
  .stale-banner .sub { font-weight:500; font-size:11.5px; margin-top:4px; opacity:.9; }
  .bucket-label { font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--ink-faint); text-transform:uppercase; padding:0 2px; }
  section { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  section.carryover { border-color: color-mix(in srgb, var(--amber) 40%, var(--border)); }
  h2 { font-size:12.5px; margin:0; letter-spacing:.02em; }
  .status { display:inline-block; font-size:10px; font-weight:700; border-radius:999px; padding:2px 8px; background:var(--good-soft); color:var(--good); }
  .status.notready { background:var(--critical-soft); color:var(--critical); }
  .status.production { background:var(--amber-soft); color:var(--amber); }
  .status.posted { background:var(--surface-sunken); color:var(--ink-muted); }
  .status.waiting { background:var(--amber-soft); color:var(--amber); }
  .txt { background:var(--surface-sunken); border-radius:10px; padding:10px 12px; font-size:13.5px; line-height:1.7; white-space:pre-wrap; }
  .carryover-meta { font-size:11px; color:var(--amber); font-weight:700; }
  .carryover-reason { font-size:11.5px; color:var(--ink-muted); }
  video { width:100%; border-radius:10px; display:block; background:#000; }
  button, a.btn { font-size:12px; font-weight:700; border-radius:999px; padding:7px 14px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
  button.primary, a.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .kpi { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .kpi .tile { background:var(--surface-sunken); border-radius:10px; padding:10px 12px; }
  .kpi .k { font-size:10.5px; color:var(--ink-faint); }
  .kpi .v { font-size:18px; font-weight:800; }
  .oa-item { font-size:13px; padding:6px 0; border-bottom:1px dashed var(--border); }
  .oa-item:last-child { border-bottom:none; }
  footer { text-align:center; font-size:10px; color:var(--ink-faint); padding-top:10px; line-height:1.6; }
  #app { display:flex; flex-direction:column; gap:16px; }
  .loading { text-align:center; padding:40px 0; color:var(--ink-faint); font-size:13px; }
</style>
</head>
<body>
<div class="page" id="app">
  <div class="loading" id="loading">読み込み中…</div>
</div>
<script>
(function () {
  var EPOCH_DATE = '2026-09-08'; // workai-mcp/src/lib/coordination.mjs businessDay()と同一定義
  var DATA_URL = 'current.json';
  var copyTargets = {};

  // サーバーデータに一切頼らず、今日のJST日付から期待されるBusiness Dayを自力計算する。
  // バックエンド・Routineが完全に停止していてもこの計算だけは常に成立する。
  function expectedBusinessDayInfo() {
    var now = new Date();
    var jstMs = now.getTime() + (now.getTimezoneOffset() * 60000) + (9 * 3600000);
    var jst = new Date(jstMs);
    var y = jst.getFullYear(), m = String(jst.getMonth() + 1).padStart(2, '0'), d = String(jst.getDate()).padStart(2, '0');
    var dateStr = y + '-' + m + '-' + d;
    var day = 7 + Math.round((Date.parse(dateStr) - Date.parse(EPOCH_DATE)) / 86400000);
    return {date: dateStr, business_day: day};
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtStamp(iso) {
    if (!iso) return '不明';
    try {
      return new Date(iso).toLocaleString('ja-JP', {timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
    } catch (e) { return iso; }
  }

  function copyText(key, btn) {
    var text = copyTargets[key] || '';
    navigator.clipboard.writeText(text).then(function () {
      var orig = btn.textContent;
      btn.textContent = 'コピーしました ✓';
      setTimeout(function () { btn.textContent = orig; }, 2000);
    });
  }
  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-copy-key]');
    if (btn) copyText(btn.getAttribute('data-copy-key'), btn);
  });

  function statusBadge(status, readyLabel) {
    if (status === 'ready' || status === 'posted') return '<span class="status">' + esc(readyLabel || 'READY') + '</span>';
    if (status === 'in_production') return '<span class="status production">IN PRODUCTION</span>';
    return '<span class="status notready">NOT READY' + (status ? ' (' + esc(status) + ')' : '') + '</span>';
  }

  function renderToday(data) {
    var t = data.today || {};
    var html = '<div class="bucket-label">TODAY — DAY ' + esc(data.business_day) + '</div>';

    var x = t.x_post;
    html += '<section><h2>07:30 X POST</h2>';
    if (x && x.status === 'ready' && x.text) {
      copyTargets['x-post'] = x.text;
      html += statusBadge('ready', 'READY') + '<div class="txt">' + esc(x.text) + '</div>' +
        '<button class="primary" data-copy-key="x-post">投稿文をコピー</button>';
    } else {
      html += statusBadge((x && x.status) || 'not_ready') +
        '<div class="carryover-reason">' + esc((x && x.reason) || '本日分のX本文はまだ準備できていません') + '</div>';
    }
    html += '</section>';

    var ig = t.ig_reel;
    html += '<section><h2>07:45 INSTAGRAM REEL</h2>';
    if (ig && ig.status === 'ready' && ig.video_file) {
      copyTargets['ig-caption'] = ig.caption || '';
      html += statusBadge('ready', 'READY') +
        '<video controls preload="metadata" src="' + esc(ig.video_file) + '"></video>' +
        (ig.caption ? '<div class="txt">' + esc(ig.caption) + '</div>' : '') +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<a class="btn primary" href="' + esc(ig.video_file) + '" target="_blank" rel="noopener">MP4を開く ›</a>' +
        '<button data-copy-key="ig-caption">キャプションをコピー</button></div>';
    } else {
      html += statusBadge((ig && ig.status) || 'not_ready') +
        '<div class="carryover-reason">' + esc((ig && ig.reason) || '本日分のReelはまだ準備できていません') + '</div>';
      if (ig && ig.script) {
        copyTargets['ig-script'] = ig.script;
        html += '<details><summary style="cursor:pointer;font-size:12px;font-weight:700;color:var(--ink-muted)">原稿を見る(' + esc(ig.script_status || '') + ')</summary>' +
          '<div class="txt" style="margin-top:8px">' + esc(ig.script) + '</div></details>' +
          '<button data-copy-key="ig-script">原稿をコピー</button>';
      }
    }
    html += '</section>';
    return html;
  }

  function renderCarryover(data) {
    var items = data.carryover || [];
    if (!items.length) return '';
    var html = '<div class="bucket-label">CARRYOVER / BLOCKED</div>';
    items.forEach(function (item, idx) {
      var key = 'carry-' + idx;
      if (item.type === 'x_post') {
        copyTargets[key] = item.text || '';
        html += '<section class="carryover"><h2>X本投稿(Day' + esc(item.originally_day) + '・持ち越し)</h2>' +
          '<div class="carryover-meta">Originally: Day' + esc(item.originally_day) + '</div>' +
          '<div class="carryover-reason">持ち越し理由: ' + esc(item.reason || '') + ' / 現在の状態: ' + esc(item.current_status || '') + '</div>' +
          '<div class="txt">' + esc(item.text) + '</div>' +
          '<button class="primary" data-copy-key="' + key + '">投稿文をコピー</button></section>';
      } else if (item.type === 'ig_reel') {
        copyTargets[key] = item.caption || '';
        html += '<section class="carryover"><h2>Instagram Reel(Day' + esc(item.originally_day) + '・持ち越し)</h2>' +
          '<div class="carryover-meta">Originally: Day' + esc(item.originally_day) + '</div>' +
          '<div class="carryover-reason">持ち越し理由: ' + esc(item.reason || '') + ' / 現在の状態: ' + esc(item.current_status || '') + '</div>' +
          (item.video_file ? '<video controls preload="metadata" src="' + esc(item.video_file) + '"></video>' : '') +
          (item.caption ? '<div class="txt">' + esc(item.caption) + '</div>' : '') +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          (item.video_file ? '<a class="btn primary" href="' + esc(item.video_file) + '" target="_blank" rel="noopener">MP4を開く ›</a>' : '') +
          '<button data-copy-key="' + key + '">キャプションをコピー</button></div></section>';
      }
    });
    return html;
  }

  function renderApprovalQueue(data) {
    var q = data.approval_queue || [];
    var html = '<div class="bucket-label">APPROVAL QUEUE</div><section>';
    if (q.length) {
      q.forEach(function (a, idx) {
        var key = 'approval-' + idx;
        copyTargets[key] = a.text || '';
        html += '<div class="txt">' +
          '<div style="font-weight:700;font-size:12.5px">' + esc(a.target || '') + (a.priority ? ' <span style="font-weight:500;color:var(--ink-faint)">(' + esc(a.priority) + ')</span>' : '') + '</div>' +
          '<div style="font-size:11.5px;color:var(--ink-muted);margin:2px 0">' + esc(a.why || '') + '</div>' +
          '<div style="margin-top:4px">' + esc(a.text || '') + '</div>' +
          (a.created_at ? '<div style="font-size:10.5px;color:var(--ink-faint);margin-top:4px">作成: ' + esc(fmtStamp(a.created_at)) + (a.freshness ? ' / ' + esc(a.freshness) : '') + '</div>' : '') +
          '<button style="margin-top:6px" data-copy-key="' + key + '">返信文をコピー</button></div>';
      });
    } else {
      html += '<div class="oa-item">現在、承認待ちの戦略返信候補はありません</div>';
    }
    html += '</section>';
    return html;
  }

  function renderHistory(data) {
    var h = data.history || [];
    if (!h.length) return '';
    var html = '<div class="bucket-label">COMPLETED / HISTORY</div><section>';
    h.forEach(function (item) {
      if (item.type === 'x_post') {
        html += '<div class="oa-item">X本投稿(Day' + esc(item.day) + ') — 投稿済み' +
          (item.url ? ' <a href="' + esc(item.url) + '" target="_blank" rel="noopener">投稿を見る ›</a>' : '') + '</div>';
      } else if (item.type === 'ig_reel') {
        html += '<div class="oa-item">Instagram Reel(Day' + esc(item.day) + ') — 投稿済み</div>';
      }
    });
    html += '</section>';
    return html;
  }

  function render(data, staleInfo) {
    var app = document.getElementById('app');
    var stamp = fmtStamp(data.data_updated_at);
    var publicStamp = fmtStamp(data.public_updated_at);
    var healthClass = data.system_health === 'ok' ? '' : data.system_health === 'red' ? 'red' : 'attention';
    var healthLabel = data.system_health === 'ok' ? 'Normal' : data.system_health === 'red' ? 'Owner Required' : 'Attention';
    // ハード鮮度ルール: staleInfo.staleがtrueの間、SYSTEM HEALTHはNormalを絶対に名乗らない。
    if (staleInfo.stale && healthClass === '') { healthClass = 'red'; healthLabel = 'Owner Required'; }

    var html = '';
    html += '<div class="hdr"><div><div class="daybadge">Day ' + esc(data.business_day) + ' / 100</div><h1>WorkAI Production Cockpit</h1></div>' +
      '<div class="updated">Data Updated: ' + stamp + '<br>Public Updated: ' + publicStamp + '</div></div>';

    if (staleInfo.stale) {
      html += '<div class="stale-banner">⚠ PUBLIC DATA STALE<div class="sub">' + esc(staleInfo.reason) + '</div></div>';
    }

    html += '<div class="health ' + healthClass + '">SYSTEM HEALTH: ' + healthLabel +
      (data.system_health_reason ? '<div class="health-reason">' + esc(data.system_health_reason) + '</div>' : '') + '</div>';

    html += renderToday(data);
    html += renderCarryover(data);
    html += renderApprovalQueue(data);

    html += '<section><h2>今日Ownerがやること</h2>';
    if (!data.owner_actions || data.owner_actions.length === 0) {
      html += '<div class="oa-item">✓ Owner作業なし</div>';
    } else {
      data.owner_actions.forEach(function (a) { html += '<div class="oa-item">□ ' + esc(a) + '</div>'; });
    }
    html += '</section>';

    var r = data.revenue || {};
    html += '<section><h2>KPIサマリー</h2><div class="kpi">' +
      '<div class="tile"><div class="k">Revenue</div><div class="v">¥' + esc(r.revenue_jpy) + '</div></div>' +
      '<div class="tile"><div class="k">Profit</div><div class="v">¥' + esc(r.profit_jpy) + '</div></div>' +
      '<div class="tile"><div class="k">Day30まで</div><div class="v">' + esc(r.day30_remaining) + '日</div></div>' +
      '<div class="tile"><div class="k">Day100まで</div><div class="v">' + esc(r.day100_remaining) + '日</div></div>' +
      '<div class="tile"><div class="k">Product Signals</div><div class="v">' + esc(r.product_signals) + '</div></div>' +
      '<div class="tile"><div class="k">Blocked Tasks</div><div class="v">' + esc(r.blocked_tasks) + '</div></div>' +
      '</div></section>';

    if (data.ai_learning) {
      var al = data.ai_learning;
      html += '<section><h2>AI Learning</h2><div class="txt">' +
        '<div><b>Observation:</b> ' + esc(al.observation || '') + '</div>' +
        (al.hypothesis ? '<div style="margin-top:6px"><b>Hypothesis:</b> ' + esc(al.hypothesis) + '</div>' : '') +
        (al.decision ? '<div style="margin-top:6px"><b>Decision:</b> ' + esc(al.decision) + '</div>' : '') +
        (al.next_experiment ? '<div style="margin-top:6px"><b>Next:</b> ' + esc(al.next_experiment) + '</div>' : '') +
        '</div></section>';
    }

    html += renderHistory(data);

    html += '<footer>WorkAI SSOT(data/publish/today.json)から自動生成。手編集なし。<br>' +
      'current.jsonをキャッシュ回避付きで毎回取得し、クライアント側で独立に鮮度検証。</footer>';

    app.innerHTML = html;
  }

  function renderFatalError(message) {
    document.getElementById('app').innerHTML =
      '<div class="stale-banner">⚠ PUBLIC DATA STALE<div class="sub">' + esc(message) + '</div></div>';
  }

  function load(attempt) {
    var expected = expectedBusinessDayInfo();
    fetch(DATA_URL + '?ts=' + Date.now(), {cache: 'no-store'})
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (data) {
        var staleInfo = {stale: false, reason: ''};
        if (data.business_day !== expected.business_day) {
          staleInfo = {
            stale: true,
            reason: '端末側で計算した本日のBusiness Day(Day ' + expected.business_day + ' / ' + expected.date + ')と、' +
              '取得データのBusiness Day(Day ' + data.business_day + ')が一致しません。表示中のデータは最新でない可能性があります。'
          };
        }
        render(data, staleInfo);
      })
      .catch(function (err) {
        if (attempt < 3) { setTimeout(function () { load(attempt + 1); }, 800 * (attempt + 1)); return; }
        renderFatalError('current.jsonを取得できませんでした(' + err.message + ')。ネットワーク状態を確認し、時間を置いて開き直してください。');
      });
  }

  load(0);
})();
</script>
</body>
</html>
